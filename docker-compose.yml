services:

  postgres:
    image: postgres:17
    container_name: voiceai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - voice-ai

  redis:
    image: redis:8-alpine
    container_name: voiceai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - voice-ai

  livekit:
    image: livekit/livekit-server:latest
    container_name: voiceai-livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    depends_on:
      - redis
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT}:7880"
      - "${LIVEKIT_RTC_TCP_PORT}:7881"
      - "${LIVEKIT_RTC_PORT}:7882/udp"
    networks:
      - voice-ai

  sip:
    image: livekit/sip:latest
    container_name: voiceai-sip
    restart: unless-stopped
    depends_on:
      - livekit
      - redis
    environment:
      # POC/LAN setup, not a public deployment. Two things this needs that
      # network_mode: host would normally give you for free on native Linux
      # Docker do NOT work the same way on Docker Desktop for Windows/WSL2
      # (host-mode containers don't reflect their ports onto the actual
      # Windows host/LAN interface there) - so we stay on the regular
      # bridge network and publish the SIP/RTP ports explicitly below
      # instead. nat_1_to_1_ip/media_nat_1_to_1_ip tell the SIP service to
      # advertise ${SIP_LAN_IP} (this machine's externally-reachable IP -
      # read from the top-level .env, the SINGLE place this now needs to
      # be set - see infra/render-config.sh, which renders the same value
      # into infra/livekit/livekit.yaml's node_ip and infra/kamailio/
      # kamailio.cfg's advertise line, since neither of those files gets
      # docker-compose's own ${VAR} substitution) in SIP/SDP instead of its
      # internal Docker network IP - without this, callers get an
      # unreachable address back and media (RTP) never connects even
      # though signaling (INVITE/200 OK) works.
      # rtp_port sizes how many calls can have active media (RTP) at the
      # same time - one port pair per call, roughly. Widened from
      # 10000-10020 (21 ports, sized for the original one-call-at-a-time
      # demo) to 10000-10100 (100 ports) as part of adding concurrent,
      # multi-tenant call support (see setup-sip.ts's `type: 'individual'`
      # dispatch rule) - still short of the usual 10000-20000 full range
      # since publishing thousands of individual UDP ports through
      # Docker Desktop's port-forwarding proxy is slow to start, and 100
      # concurrent calls is well beyond this deployment's near-term needs.
      # The published port range below, and the GCP firewall rule in
      # docs/gcp-deployment.md, must both match this.
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5061
        rtp_port: 10000-10100
        nat_1_to_1_ip: ${SIP_LAN_IP}
        media_nat_1_to_1_ip: ${SIP_LAN_IP}
        # 'log_level: debug' (tried 2026-09-07) was silently ignored - this
        # service's log level lives under a nested 'logging:' block, not a
        # top-level 'log_level' key (confirmed from livekit/sip's own source,
        # pkg/config/config.go). Kept at debug in case deeper SDP/media
        # tracing is needed later; the fix below doesn't depend on it.
        logging:
          level: debug
        # Root cause of the persistent one-way-audio report (2026-09-07):
        # this service was trusting the *caller's own* SDP-declared media
        # address unconditionally. One tester's SIP client (likely due to a
        # router/SIP ALG issue - confirmed NOT Tailscale, NOT CGNAT on the
        # laptop itself) declared a bogus 100.64.0.0/10-range address in its
        # SDP; a tcpdump on the VM confirmed livekit-sip was dutifully
        # sending audio there instead of back to the caller's real address.
        # symmetric_rtp makes livekit-sip ignore the SDP claim entirely and
        # always send media back to wherever that call's packets are
        # actually arriving from (confirmed via livekit/sip source,
        # pkg/sip/media_port.go/media_pipeline.go) - first added in v1.3.1
        # (PR livekit/sip#624, #687), safe here since we don't use hold/
        # transfer and every caller is an untrusted consumer network anyway.
        symmetric_rtp: true
    # SIP signaling port (5061) is intentionally NOT published to the host
    # anymore - Linphone Android refuses to unlock its dialer without a
    # successful REGISTER, and this service deliberately never implements
    # REGISTER (confirmed from its own logs). The sip-registrar (Kamailio)
    # service below is what's externally reachable now; it answers
    # REGISTER itself and relays everything else here over the internal
    # docker network. RTP still bypasses both proxies and goes straight
    # phone <-> this container, so its port range stays published.
    ports:
      - "10000-10100:10000-10100/udp"
    networks:
      - voice-ai

  sip-registrar:
    image: ghcr.io/kamailio/kamailio:6.1.4-bookworm
    container_name: voiceai-sip-registrar
    restart: unless-stopped
    environment:
      - KAMAILIO_DEBUG=3
      - LOG_STDERROR=yes
    depends_on:
      - sip
    volumes:
      - ./infra/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    networks:
      - voice-ai

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - ./backend/.env
    container_name: voiceai-backend
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      - postgres
      - redis
    networks:
      - voice-ai

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: voiceai-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${FRONTEND_PORT}:3041"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - voice-ai

  ai-runtime:
    build:
      context: .
      dockerfile: infra/docker/ai-runtime.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - ./ai-runtime/.env
    # SIP_LAN_IP used to be duplicated into ai-runtime/.env by hand (used
    # by src/setup-sip.ts to build the default allowed-caller CIDR and to
    # print the Linphone setup address). Injected here instead, straight
    # from the same top-level .env the `sip` service above already reads
    # it from - one fewer place this can drift out of sync. `environment:`
    # entries override same-named keys from `env_file:` above, so this
    # takes precedence over any leftover SIP_LAN_IP= line in ai-runtime/.env.
    environment:
      SIP_LAN_IP: ${SIP_LAN_IP}
    container_name: voiceai-runtime
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./ai-runtime:/app
      - runtime-node-modules:/app/node_modules
    depends_on:
      - livekit
      - redis
    networks:
      - voice-ai

volumes:
  postgres-data:
  redis-data:
  backend-vendor:
  frontend-node-modules:
  runtime-node-modules:

networks:
  voice-ai:
    driver: bridge
